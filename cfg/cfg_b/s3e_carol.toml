# S3E Carol Velodyne and IMU.

[io]
map_directory = "s3e_carol-method-b-map"
global_map_voxel_size = 0.8

[odometry]
voxel_size = 0.25
voxel_capacity = 350000
enable_map_feedback = true
map_feedback_ba = false

[odometry.crop_box]
min_x = -0.5
min_y = -0.5
min_z = -0.5
max_x = 0.5
max_y = 0.5
max_z = 0.5

[submap]
max_range_m = 80.0

[pgo]
enabled = true

[pgo.occupancy]
enabled = false

[sensor.lidar]
time_field = "time"
time_unit = "s"
time_ref = "relative"
max_scan_duration = 0.2
header_tolerance = 0.5
require_point_time = true

[sensor.imu]
gravity = 9.79172227
# iESKF process noise variances
gyro_var = 0.01
accel_var = 0.01
gyro_bias_var = 0.0001
accel_bias_var = 0.0001

[extrinsics.T_imu_lidar]
translation = [0.007784371906518, -0.204024496061082, -0.029045411719168]
rotation_xyzw = [-0.00824618, 0.01007824, 0.01099053, 0.99985481]
