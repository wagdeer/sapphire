# Experimental direction-aware ESKF profile for Livox Mid-360.
# Keep sapphire_mid360.toml as the validated observer-hybrid rollback profile.

[imu]
gravity = 9.80665

[imu.init]
convergence_gyro_std = 0.005
convergence_accel_std = 0.05
timeout_sec = 5.0
check_interval_sec = 0.5
min_samples = 100

[imu.noise]
accel_noise_density = 0.000196
gyro_noise_density = 0.000152
accel_random_walk = 0.000165
gyro_random_walk = 0.0000655
accel_bias_rw_sigma = 0.000165
gyro_bias_rw_sigma = 0.0000655

[odometry]
voxel_size = 0.25
fusion = "eskf"

[odometry.crop_box]
min_x = -1.0
min_y = -1.0
min_z = -1.0
max_x = 1.0
max_y = 1.0
max_z = 1.0

[odometry.observer]
position_gain = 4.5
velocity_gain = 11.25
orientation_gain = 4.0
accel_bias_gain = 2.25
gyro_bias_gain = 1.0
accel_bias_max = 10.0
gyro_bias_max = 0.5

[odometry.eskf]
sigma_rotation = 0.02
sigma_translation = 0.05
icp_covariance_scale = 25.0
use_hessian = true
hessian_min_information = 1e-6
hessian_max_condition = 10000.0
hessian_degenerate_sigma = 1.0
hessian_max_sigma = 10.0
# Retain registration hard gates; collect NIS before enabling a statistical gate.
mahalanobis_threshold = -1.0
# Pose uses the bounded Hessian observability gain. Velocity keeps the
# validated observer gain during stage 1, projected through the same
# observability so weak geometry cannot inject a full correction.
inject_full_pose = false
inject_directional_pose = true
velocity_correction_gain = 8.0
# Bias remains frozen during pose/velocity bring-up. Its covariance RW is active.
bias_update_scale = 0.0
accel_bias_max = 10.0
gyro_bias_max = 0.5
# Bring-up starts uncertain enough for the first accepted scan to establish
# the posterior instead of locking the filter to the stationary initializer.
init_sigma_theta = 0.1
init_sigma_velocity = 0.5
init_sigma_position = 0.5

[odometry.submap]
splitting_distance = 1.5
splitting_rotation = 0.7853981633974483
max_keyframes = 10
voxel_size = 0.25

[registration]
type = "VGICP"

[registration.gicp]
max_iterations = 32
transformation_epsilon = 0.01
rotation_epsilon = 0.01
max_correspondence_dist = 0.5
k_correspondences = 16
min_num_points = 64
max_correction_trans = 1.0
max_correction_rot_deg = 20.0

[registration.vgicp]
voxel_resolution = 0.5

[pgo]
enabled = true
keyframe_distance = 0.5
keyframe_rotation = 0.3
loop_min_time_separation = 30.0
loop_min_travel_distance = 30.0
loop_max_rotation = 3.14
loop_search_radius = 15.0
loop_search_stride = 1
target_frame_count = 50
source_voxel_size = 0.4
target_voxel_size = 0.4
fitness_threshold = 0.5
update_period_sec = 1.0
map_frame_stride = 3
map_voxel_size = 0.8

[pgo.occupancy]
# d = world Z relative to sensor (≈ lidar-frame z on flat ground).
# h_clearance ≈ sensor height above ground (vehicle Mid-360 ~2m).
# ground_margin raises the HIT lower bound: hit iff
#   d >= -h_clearance + ground_margin
# so the near-ground slice is skipped (not occupied / does not lock d_min).
# Too small h_clearance (e.g. 0.15) only keeps a thin slice at the lidar.
enabled = true
resolution = 0.1
h_clearance = 2.0
ground_margin = 0.5
d_max = 6.0
occ_threshold = 0.3
usable_range = 40.0
min_range = 0.5
cloud_voxel_size = 0.4
margin = 5.0

[deskew]
time_offset = false

[extrinsics.T_imu_lidar]
translation = [0.0, 0.0, 0.0]
rotation_xyzw = [0.0, 0.0, 0.0, 1.0]
