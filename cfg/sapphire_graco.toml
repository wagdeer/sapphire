# GrAco ground-04 profile (VLP-16 + g320N).
# Algorithm knobs match sapphire_mid360.toml. Sensor values come from
# /data/GrAco/ground-04 and the bag itself.
#
#   ros2 launch sapphire_ros2 sapphire.launch.py \
#     config_file:=/workspace/src/sapphire/cfg/sapphire_graco.toml \
#     lidar_topic:=/velodyne/points \
#     imu_topic:=/gnss/imu
#
# ground-04 is still for about 1.5 s, then it drives. Init is capped at 1.2 s
# so a timeout still uses that stationary prefix (125 Hz, 100 samples ≈ 0.8 s).
# Measured there: gyro_σ ≈ 0.001 rad/s, accel_σ ≈ 0.030 m/s², |a| ≈ 9.805.

[imu]
gravity = 9.80665

[imu.init]
convergence_gyro_std = 0.005
convergence_accel_std = 0.05
timeout_sec = 1.2
check_interval_sec = 0.4
min_samples = 100

[imu.noise]
# imu.yaml, sensor_type g320N. Densities are continuous-time Allan values.
# random_walk units in that file are m/s³/√Hz and rad/s²/√Hz, which is the
# bias diffusion sigma Sapphire stores as *_random_walk / *_bias_rw_sigma.
accel_noise_density = 1.0028108e-02
gyro_noise_density = 8.3723892e-04
accel_random_walk = 5.5367077e-04
gyro_random_walk = 1.5212086e-05
accel_bias_rw_sigma = 5.5367077e-04
gyro_bias_rw_sigma = 1.5212086e-05

[odometry]
voxel_size = 0.25
fusion = "eskf"

# LiDAR-frame body filter. VLP-16 writes no-return points at the origin
# (~15% of each scan) and a persistent self-return near
# x ∈ [-0.42, 0.37], y ∈ [-0.67, -0.59], z ≈ -0.19 (r ≈ 0.75 m).
# Scene points sit outside this cube.
[odometry.crop_box]
min_x = -1.0
min_y = -1.0
min_z = -1.0
max_x = 1.0
max_y = 1.0
max_z = 1.0

[odometry.observer]
position_gain = 4.5
velocity_gain = 11.25
orientation_gain = 4.0
accel_bias_gain = 2.25
gyro_bias_gain = 1.0
accel_bias_max = 10.0
gyro_bias_max = 0.5

[odometry.eskf]
sigma_rotation = 0.02
sigma_translation = 0.05
icp_covariance_scale = 25.0
use_hessian = true
hessian_min_information = 1e-6
hessian_max_condition = 10000.0
hessian_degenerate_sigma = 1.0
hessian_max_sigma = 10.0
# Retain registration hard gates; collect NIS before enabling a statistical gate.
mahalanobis_threshold = -1.0
# Pose uses the bounded Hessian observability gain. Velocity keeps the
# validated observer gain during stage 1, projected through the same
# observability so weak geometry cannot inject a full correction.
inject_full_pose = false
inject_directional_pose = true
velocity_correction_gain = 8.0
# Bias remains frozen during pose/velocity bring-up. Its covariance RW is active.
bias_update_scale = 0.0
accel_bias_max = 10.0
gyro_bias_max = 0.5
# Bring-up starts uncertain enough for the first accepted scan to establish
# the posterior instead of locking the filter to the stationary initializer.
init_sigma_theta = 0.1
init_sigma_velocity = 0.5
init_sigma_position = 0.5

[odometry.submap]
splitting_distance = 1.5
splitting_rotation = 0.7853981633974483
max_keyframes = 10
voxel_size = 0.25

[registration]
type = "VGICP"

[registration.gicp]
max_iterations = 32
transformation_epsilon = 0.01
rotation_epsilon = 0.01
# VLP-16 ring spacing is ~0.35 m at 10 m and ~0.7 m at 20 m.
max_correspondence_dist = 1.0
k_correspondences = 16
min_num_points = 64
max_correction_trans = 1.0
max_correction_rot_deg = 20.0

[registration.vgicp]
voxel_resolution = 1.0

[pgo]
enabled = true
keyframe_distance = 0.5
keyframe_rotation = 0.3
loop_min_time_separation = 30.0
loop_min_travel_distance = 30.0
loop_max_rotation = 3.14
loop_search_radius = 30.0
loop_search_stride = 1
target_frame_count = 50
source_voxel_size = 0.4
target_voxel_size = 0.4
# Query cloud only. Graph nodes stay at keyframe_distance.
# Keyframes within this odometry travel are transformed into the query frame.
source_travel_radius_m = 10.0
# Drop points beyond this range in the scan that observed them, not after
# they have been moved into the query frame.
# VLP-16 still returns past 80 m; p90 of ground-04 is ~44 m.
source_max_range_m = 40.0
# Stationary cap. Travel does not grow while spinning in place.
source_max_frames = 256
lidar_min_inliers = 64
lidar_max_iterations = 32
lidar_max_correspondence_m = 2.0
lidar_min_overlap = 0.5
lidar_max_fitness_m2 = 0.5
lidar_translation_sigma_m = 0.2
lidar_rotation_sigma_rad = 0.1
# Drop the trial if any binary edge exceeds this many standard deviations.
max_constraint_error_sigma = 3.0
update_period_sec = 1.0
map_frame_stride = 3
map_voxel_size = 0.8

[pgo.occupancy]
# Disabled. If enabled: ground returns in this bag sit near lidar z ≈ -0.88 m.
enabled = false
resolution = 0.1
h_clearance = 0.9
ground_margin = 0.3
clear_height_eps = 0.1
d_max = 6.0
occ_threshold = 0.3
usable_range = 40.0
min_range = 0.5
cloud_voxel_size = 0.4
margin = 5.0

# Velodyne driver: float32 field "time", seconds relative to the cloud header.
# Measured span on ground-04 is 0.100 s (10 Hz).
[sensor.lidar]
time_field = "time"
time_unit = "s"
time_ref = "relative"
max_scan_duration = 0.2
header_tolerance = 0.5
require_point_time = true

# Bag linear_acceleration is already m/s² (|mean| ≈ 9.805). Gyro is rad/s.
[sensor.imu]
accel_unit = "m_s2"

# imu-lidar.yaml T_Imu_Lidar, row-major. Maps a LiDAR point into the IMU frame:
#   p_imu = R * p_lidar + t
# Rotation is 0.86 deg; quaternion is xyzw.
[extrinsics.T_imu_lidar]
translation = [-0.01192777, -0.01973063, 0.12260907]
rotation_xyzw = [-0.00383904, 0.00395939, -0.00511026, 0.99997173]

# TUM RGB-D dump on exit: timestamp tx ty tz qx qy qz qw.
# Leave trajectory_dir empty to skip.
[output]
trajectory_dir = ""
trajectory_file = "trajectory.tum"
