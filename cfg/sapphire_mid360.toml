# Sapphire configuration for Livox Mid-360.
# Point offset_time must be converted from nanoseconds to seconds by the ROS adapter.

[imu]
gravity = 9.80665

[imu.init]
convergence_gyro_std = 0.005
convergence_accel_std = 0.05
timeout_sec = 5.0
check_interval_sec = 0.5
min_samples = 100

[imu.noise]
accel_noise_density = 0.000196
gyro_noise_density = 0.000152
accel_random_walk = 0.000165
gyro_random_walk = 0.0000655

[odometry]
# Downsample each deskewed scan before GICP. Matches the validated DLIO profile.
voxel_size = 0.25

[odometry.crop_box]
min_x = -1.0
min_y = -1.0
min_z = -1.0
max_x = 1.0
max_y = 1.0
max_z = 1.0

[odometry.observer]
# Matches the validated DLIO Mid-360 geometric observer.
position_gain = 4.5
velocity_gain = 11.25
orientation_gain = 4.0
accel_bias_gain = 2.25
gyro_bias_gain = 1.0
accel_bias_max = 10.0
gyro_bias_max = 0.5

[odometry.submap]
splitting_distance = 1.5
splitting_rotation = 0.7853981633974483
max_keyframes = 10
voxel_size = 0.25

[registration]
type = "GICP"

[registration.gicp]
max_iterations = 32
transformation_epsilon = 0.01
rotation_epsilon = 0.01
max_correspondence_dist = 0.5
k_correspondences = 16
min_num_points = 64
max_correction_trans = 1.0
max_correction_rot_deg = 20.0

[pgo]
enabled = true
keyframe_distance = 0.5
keyframe_rotation = 0.3
loop_min_time_separation = 30.0
loop_min_travel_distance = 30.0
loop_max_rotation = 3.14
loop_search_radius = 15.0
loop_search_stride = 1
target_frame_count = 50
source_voxel_size = 0.4
target_voxel_size = 0.4
fitness_threshold = 0.5
update_period_sec = 1.0
map_frame_stride = 3
map_voxel_size = 0.8

[deskew]
# Mid-360 offset_time is already relative to the message reference timestamp.
time_offset = false

[extrinsics.T_imu_lidar]
# T_imu_lidar maps LiDAR-frame points into the IMU frame:
# p_imu = R_imu_lidar * p_lidar + translation
#
# In the referenced dlio_mid360.yaml, baselink2imu and baselink2lidar
# are identical, so their relative transform is identity.
translation = [0.0, 0.0, 0.0]
rotation_xyzw = [0.0, 0.0, 0.0, 1.0]

[cuda]
enabled = false
